name: multai-staging
services:
  nginx:
    image: nginx:alpine
    container_name: multi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./multai.nginx:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi
    networks:
      - edge
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    container_name: multi_postgres
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    container_name: multi_nats
    restart: unless-stopped
    command: >
      -js
      -sd /data
      -a 0.0.0.0
      -m ${NATS_MONITOR_PORT}
      --user ${NATS_USER}
      --pass ${NATS_PASSWORD}
    volumes:
      - nats_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${NATS_MONITOR_PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: multi_minio
    restart: unless-stopped
    env_file:
      - .env.staging
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: multi_redis
    restart: unless-stopped
    env_file:
      - .env.staging
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  fastapi:
    image: ghcr.io/microclub-usthb/multai-back:develop
    container_name: multi_fastapi
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
            r = urllib.request.urlopen('http://localhost:8000/health', timeout=4)
            sys.exit(0 if r.status == 200 else 1)
          except Exception:
            sys.exit(1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  migrate:
    image: ghcr.io/microclub-usthb/multai-back:develop
    container_name: multi_migrate
    restart: "no"
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    networks:
      - data

  email-worker:
    image: ghcr.io/microclub-usthb/multai-back:develop
    container_name: multi_email_worker
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      nats:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.worker.email_worker.main"]
    networks:
      - backend
      - data

  photo-worker:
    image: ghcr.io/microclub-usthb/multai-back:develop
    container_name: multi_photo_worker
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.worker.photo_worker.main"]
    networks:
      - backend
      - data

  notification-worker:
    profiles: ["firebase"]
    image: ghcr.io/microclub-usthb/multai-back:develop
    container_name: multi_notification_worker
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.worker.notification.main"]
    networks:
      - backend
      - data

  upload-group-worker:
    image: ghcr.io/microclub-usthb/multai-back:develop
    container_name: multi_upload_group_worker
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.worker.upload_group_worker.main"]
    networks:
      - backend
      - data

  audit-worker:
    image: ghcr.io/microclub-usthb/multai-back:develop
    container_name: multi_audit_worker
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.worker.audit.main"]
    networks:
      - backend
      - data

  storage-cleaner:
    image: ghcr.io/microclub-usthb/multai-back:develop
    container_name: multi_storage_cleaner
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "app.worker.storage_cleaner.main"]
    networks:
      - backend
      - data

volumes:
  postgres_data:
  minio_data:
  redis_data:
  nats_data:

networks:
  edge:
    driver: bridge
  backend:
    internal: true
  data:
    internal: true